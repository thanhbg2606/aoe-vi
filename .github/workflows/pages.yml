# Build src/ + lang/ thành aoe-vi.min.js và đưa lên GitHub Pages
# URL: https://thanhbg2606.github.io/aoe-vi/aoe-vi.min.js
name: Build & deploy

on:
  push:
    branches: [master]
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build          # lỗi bản dịch sẽ làm bước này đỏ, không deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
